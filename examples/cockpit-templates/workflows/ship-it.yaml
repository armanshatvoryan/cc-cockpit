# Cockpit WORKFLOW (the HOW) — a declarative process the LIVE lead reads and
# executes in its own words. NOT a native JS workflow script. Place real ones at
# ~/.claude/cockpit/workflows/<name>.yaml or the project mirror. Composed with a
# roster by ROLE NAME at spin-up (the roster must cover every role named here).
name: ship-it
description: Scope -> build -> qa -> integrate, with user gates between stages.
lead_hint: >
  Drive the team through the phases below over the native file mailbox: route
  work to each role, unblock dependents, and STOP at every user gate to ask me
  before continuing. Keep each teammate focused on its phase; summarize results
  back to me at each gate.
phases:
  - id: scope
    role: product-owner
    gate: user
  - id: build
    roles: [dev, frontend]
    parallel: true
  - id: qa
    role: qa
    gate: user
  - id: integrate
    role: lead
