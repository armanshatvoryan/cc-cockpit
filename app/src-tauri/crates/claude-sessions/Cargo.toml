[package]
name = "claude-sessions"
version = "0.1.0"
edition = "2021"
description = "Claude Code session discovery: tmux-pane → session-id map, plus a transcript index over ~/.claude/projects."

[lib]
name = "claude_sessions"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
